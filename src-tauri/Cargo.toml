[package]
name = "webforge-studio"
version = "0.1.0"
description = "Webforge Studio - desktop dashboard for Webforge sites"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "webforge_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-fs = "2.5.1"
tauri-plugin-dialog = "2.7.1"
zip = "8.6.0"
hyper = { version = "1.10.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["http1", "server-auto", "server-graceful", "tokio"] }
http-body-util = "0.1.3"
tokio = { version = "1.52.3", features = ["full"] }
reqwest = { version = "0.13.4", features = ["json", "multipart", "form", "blocking"] }
urlencoding = "2.1.3"
url = "2.5.8"
async-stream = "0.3.6"
bytes = "1.12.0"
dirs-next = "2.0.0"
# Phase A: PHP-equivalent server routes
regex = "1"
glob = "0.3"

[dev-dependencies]
tempfile = "3"

