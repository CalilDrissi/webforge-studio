name: Build & Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            target: aarch64-apple-darwin
            label: macOS Apple Silicon
          - platform: macos-14
            target: x86_64-apple-darwin
            label: macOS Intel (cross-compiled)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust crates
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        working-directory: src-tauri
        run: cargo build --release --target ${{ matrix.target }}

      - name: Bundle with Tauri
        working-directory: src-tauri
        run: npx tauri build --target ${{ matrix.target }} --no-bundle

      # ---- macOS: ad-hoc sign the binary ----
      - name: Ad-hoc sign (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          codesign --sign - --force --deep \
            "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Webforge Studio.app"

      # ---- Build DMG (macOS) ----
      - name: Create DMG (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Webforge Studio.app"
          DMG="webforge-studio-${{ matrix.target }}.dmg"
          # Create a temporary DMG folder
          mkdir -p /tmp/dmg-staging
          cp -R "$APP" /tmp/dmg-staging/
          # Add a symlink to Applications for drag-to-install
          ln -sf /Applications /tmp/dmg-staging/Applications
          # Create the DMG
          hdiutil create -volname "Webforge Studio" -srcfolder /tmp/dmg-staging -ov -format UDZO "$DMG"
          # Ad-hoc sign the DMG too
          codesign --sign - --force "$DMG"
          rm -rf /tmp/dmg-staging

      # ---- Build NSIS installer (Windows) ----
      - name: Create NSIS installer (Windows)
        if: matrix.platform == 'windows-latest'
        working-directory: src-tauri
        shell: bash
        run: |
          # tauri build already creates the NSIS installer when --no-bundle is NOT used
          # Since we used --no-bundle above, run the bundler for just NSIS
          # Actually, let's use the full bundle command instead
          cargo tauri build --target ${{ matrix.target }} --bundles nsis

      # ---- Upload artifacts ----
      - name: Upload macOS DMG artifact
        if: startsWith(matrix.platform, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: webforge-studio-${{ matrix.target }}-dmg
          path: webforge-studio-${{ matrix.target }}.dmg
          if-no-files-found: warn

      - name: Upload Windows installer artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: webforge-studio-windows-exe
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: warn

  # ---- Publish: update the "latest" prerelease on every push to main ----
  publish-latest:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find artifacts -name "*.dmg" -exec cp {} release-assets/ \;
          find artifacts -name "*.exe" -exec cp {} release-assets/ \;
          find artifacts -name "*.msi" -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Delete old latest release
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create latest prerelease
        run: |
          gh release create latest \
            --title "Webforge Studio (Latest Build)" \
            --notes "Automated build from the latest commit on main. Download and test!" \
            --prerelease \
            release-assets/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---- Publish: create a stable release on tag push ----
  publish-tag:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find artifacts -name "*.dmg" -exec cp {} release-assets/ \;
          find artifacts -name "*.exe" -exec cp {} release-assets/ \;
          find artifacts -name "*.msi" -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Create stable release
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Webforge Studio ${{ github.ref_name }}" \
            --notes "Release ${{ github.ref_name }}" \
            release-assets/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}