name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon: native build on macos-14
          - platform: macos-14
            target: aarch64-apple-darwin
            label: macOS (Apple Silicon)
            cross: false
          # Intel: cross-compile from macos-14 (macos-13 runners are being retired)
          - platform: macos-14
            target: x86_64-apple-darwin
            label: macOS (Intel, cross-compiled)
            cross: true
          # Windows
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows
            cross: false

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust crates
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Target macOS 12 (Monterey) as the minimum OS version for both arches.
          # This ensures the Intel build works on macOS 12 even when cross-compiled on ARM.
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Webforge Studio ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Upload macOS DMG artifact
        if: startsWith(matrix.platform, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: Webforge-Studio-${{ matrix.target }}-dmg
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Upload Windows EXE artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Webforge-Studio-windows-exe
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: warn